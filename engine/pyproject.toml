[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitest-engine"
version = "0.1.0"
description = "AI 测试客户端确定性执行引擎：用例导入/规范检查、OpenAPI 解析、pytest 脚本生成与执行"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.optional-dependencies]
docs = ["mammoth>=1.6", "pdfplumber>=0.11"]

[project.scripts]
aitest = "aitest.cli:main"

[tool.setuptools.packages.find]
include = ["aitest*"]

[tool.setuptools.package-data]
aitest = ["schemas/*.json", "templates/*", "templates/skills/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
