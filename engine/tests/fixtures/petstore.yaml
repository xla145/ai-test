openapi: 3.0.3
info:
  title: Demo User Service
  version: "1.0"
servers:
  - url: http://localhost:8000
security:
  - bearer: []
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  schemas:
    User:
      type: object
      required: [id, name, age]
      properties:
        id: {type: integer}
        name: {type: string, minLength: 2, maxLength: 20}
        age: {type: integer, minimum: 0, maximum: 150}
    NewUser:
      type: object
      required: [name, age]
      properties:
        name: {type: string, minLength: 2, maxLength: 20}
        age: {type: integer, minimum: 0, maximum: 150}
paths:
  /users:
    get:
      operationId: listUsers
      summary: 用户列表
      tags: [用户]
      parameters:
        - {name: limit, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/User'}}
        "400": {description: bad}
    post:
      operationId: createUser
      summary: 创建用户
      tags: [用户]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewUser'}
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        "400": {description: bad}
  /users/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    delete:
      operationId: deleteUser
      summary: 删除用户
      tags: [用户]
      responses:
        "204": {description: deleted}
        "404": {description: missing}
  /health:
    get:
      operationId: health
      summary: 健康检查
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {type: string}}}
