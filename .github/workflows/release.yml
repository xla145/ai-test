name: Release

# 推送到 main 后：先跑完整测试，再构建各平台安装包与发布包，打 tag 并创建 GitHub Release。
# 版本号 = 根 package.json 的「主版本.次版本」+ 本工作流的运行序号，例如 v0.3.57。
# 要发布新的主 / 次版本，修改根 package.json 的 version 即可。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          version="${base}.${{ github.run_number }}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "发布版本：v${version}"

  packages:
    needs: [test, version]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 引擎 wheel / sdist
        run: |
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" engine/pyproject.toml
          pip install build
          python -m build engine -o dist-release
      - name: mcp-servers 与 CI 执行器（npm 包）
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          npm version "${VERSION}" -w mcp-servers --no-git-tag-version --allow-same-version
          npm run build -w mcp-servers
          npm pack -w mcp-servers --pack-destination dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist-release/*
          if-no-files-found: error

  desktop:
    needs: [test, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            files: desktop/release/*.AppImage
          - os: windows-latest
            files: desktop/release/*.exe
          - os: macos-latest
            files: desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # 未配置代码签名证书：Windows 安装包未签名；macOS 用 ad-hoc 签名（desktop/package.json 的
      # mac.identity = "-"），否则 Apple 芯片上会提示"已损坏"且无法在「隐私与安全性」中放行
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 准备引擎依赖
        run: PYTHON=python scripts/prepare-engine-deps.sh
      - name: 准备 Codex
        run: scripts/fetch-codex.sh
      - name: 构建安装包
        run: |
          npm version "${VERSION}" -w desktop --no-git-tag-version --allow-same-version
          npm run build -w desktop
          cd desktop && npx electron-builder --publish never
      - name: 校验 macOS 签名
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d desktop/release/mac*/*.app | head -n 1)
          codesign --verify --deep --strict --verbose=2 "${app}"
          codesign -dv "${app}" 2>&1 | grep -E "Signature|Identifier"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: [version, packages, desktop]
    # 某个平台失败（例如 macOS runner 排队被取消）时，仍发布已构建成功的平台，并在说明中列出缺失的平台；
    # 失败的任务在 Actions 中保持红色。测试或打包失败则不发布。
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.packages.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: 创建 tag 与 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -la assets
          shopt -s nullglob
          installers=(assets/*.exe assets/*.dmg assets/*.AppImage)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::没有任何平台的安装包构建成功，不发布"
            exit 1
          fi
          missing=()
          win=(assets/*.exe); mac=(assets/*.dmg); linux=(assets/*.AppImage)
          [ ${#win[@]} -gt 0 ] || missing+=("Windows")
          [ ${#mac[@]} -gt 0 ] || missing+=("macOS")
          [ ${#linux[@]} -gt 0 ] || missing+=("Linux")
          cat > notes.md <<'NOTES'
          ## 安装包

          | 平台 | 文件 |
          | --- | --- |
          | Windows | `aitest-desktop-*-win-x64.exe` |
          | macOS（Apple 芯片） | `aitest-desktop-*-mac-arm64.dmg` |
          | Linux | `aitest-desktop-*-linux-x86_64.AppImage` |

          桌面端需要本机安装 Python 3.10+（引擎依赖已随安装包附带）。Codex 已内置（锁定版本），
          如需使用其他版本，可用 `AITEST_CODEX_BIN` 指定 codex 路径。
          安装包未使用开发者证书签名（macOS 为 ad-hoc 签名、未公证）：
          - macOS：首次打开被拦截后，到「系统设置 → 隐私与安全性」底部点「仍要打开」；
            也可在终端执行 `xattr -dr com.apple.quarantine "/Applications/aitest-desktop.app"` 后再打开。
          - Windows：可能出现 SmartScreen 提示，点「更多信息 → 仍要运行」。

          ## 其他发布物

          - `aitest_engine-*.whl`：执行引擎（`pip install` 后提供 `aitest` 命令）
          - `ai-test-mcp-servers-*.tgz`：MCP Server 与 CI 执行器 `aitest-ci`
          NOTES
          if [ ${#missing[@]} -gt 0 ]; then
            printf '\n> ⚠️ 本次未包含 %s 安装包（构建失败或未执行），详见本次工作流运行记录。\n' "${missing[*]}" >> notes.md
          fi
          gh release create "$TAG" assets/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "AI 测试客户端 $TAG" \
            --notes-file notes.md \
            --generate-notes
