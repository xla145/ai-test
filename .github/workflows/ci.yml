name: CI

on:
  push:
    branches: ["claude/**"]
  pull_request:
  # main 上的推送由 release.yml 调用本工作流，测试通过后才打包发布
  workflow_call:

jobs:
  engine:
    runs-on: ubuntu-latest
    # 数据库校验在真实 PostgreSQL / MySQL 上测试
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: aitest
          POSTGRES_DB: aitest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: aitest
          MYSQL_DATABASE: aitest
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -paitest" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      AITEST_TEST_PG: "127.0.0.1:5432:postgres:aitest:aitest"
      AITEST_TEST_MYSQL: "127.0.0.1:3306:root:aitest:aitest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e engine
      - run: python -m pytest -q
        working-directory: engine

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium
        working-directory: mcp-servers
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
