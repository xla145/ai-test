name: CI

on:
  push:
    branches: ["claude/**"]
  pull_request:
  # main 上的推送由 release.yml 调用本工作流，测试通过后才打包发布
  workflow_call:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e engine
      - run: python -m pytest -q
        working-directory: engine

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e engine
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install Chromium for UI tests
        run: npx playwright install --with-deps chromium
        working-directory: mcp-servers
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
